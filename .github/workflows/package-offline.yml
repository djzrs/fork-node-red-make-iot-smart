# Packages the Node-RED node into offline installers and attaches them to a
# GitHub Release (auto on release creation, or to a chosen tag via manual
# workflow_dispatch).
#
# Two artifacts are produced:
#   1) <scope>-<name>-<version>.tgz  -- standard npm tarball (lightweight,
#      install with `npm install ./file.tgz`; still needs network for deps)
#   2) offline-install-<version>-linux-x64.zip -- full bundle including
#      node_modules (truly offline, but native modules are built for
#      linux-x64, so use it on a matching Linux x64 host)
#
# Triggers:
#   - a GitHub Release is created        -> uploads to that release
#   - manual workflow_dispatch:
#       * if `release_tag` is provided  -> uploads to that existing release
#       * if `release_tag` is empty     -> keeps files as run artifacts only

name: Package offline installer

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of an existing release to attach the offline packages to (e.g. v0.1.5). Leave empty to only keep run artifacts.'
        required: false
        default: ''

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to upload release assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (includes native builds)
        run: npm install --legacy-peer-deps

      - name: Create standard npm tarball
        run: npm pack

      - name: Build full offline bundle (with node_modules)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          zip -r "offline-install-${VERSION}-linux-x64.zip" . \
            -x '.git/*' -x '.git' -x 'node_modules/.cache/*'

      - name: Upload to Release
        if: github.event_name == 'release' || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          echo "Uploading offline packages to release $TAG"
          for f in *.tgz offline-install-*.zip; do
            if [ -e "$f" ]; then
              echo "  -> $f"
              gh release upload "$TAG" "$f" --clobber
            fi
          done

      - name: Upload as workflow artifacts
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: offline-installer
          path: |
            *.tgz
            offline-install-*.zip
          retention-days: 30
