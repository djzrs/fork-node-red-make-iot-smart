# Publishes the package to the public npm registry.
# Triggers: a GitHub Release is created, or a manual workflow_dispatch.
#
# Auth (pick one):
#   1) First publish / fallback: npm Granular access token with
#      "Bypass 2FA" ENABLED -> store as repo secret NPM_TOKEN.
#   2) Recommended after first publish: npm Trusted Publishers (OIDC),
#      no token needed. Keep `id-token: write` below and remove the
#      NODE_AUTH_TOKEN line. See https://docs.npmjs.com/trusted-publishers
#
# Trusted publishing requires npm CLI >= 11.5.1 (we install latest) and
# Node >= 22 (set below).

name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC / npm Trusted Publishers (and provenance)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          scope: '@djzrs'
      - run: npm install -g npm@latest   # ensure npm CLI >= 11.5.1 for OIDC/trusted publishing
      - run: npm install --legacy-peer-deps
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
